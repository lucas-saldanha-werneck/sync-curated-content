services:
  sync-raindrop:
    build: .
    image: sync-raindrop:local
    container_name: sync-raindrop
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4g,exec
      - /run
    volumes:
      - /var/lib/sync-raindrop:/var/lib/sync-raindrop
      - /opt/sync-raindrop/.env:/secrets/.env:ro
      - /opt/sync-raindrop/rclone.conf:/secrets/rclone.conf
      - /opt/files/public/sync-raindrop:/public/sync-raindrop
    environment:
      - TZ=America/Sao_Paulo
    mem_limit: 1536m
    pids_limit: 256
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,sys;d=json.load(open('/var/lib/sync-raindrop/health.json'));sys.exit(0 if d['ok'] else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
