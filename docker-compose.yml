services:
  sync-raindrop:
    build: .
    image: sync-raindrop:local
    container_name: sync-raindrop
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    read_only: true
    tmpfs:
      - /tmp:size=4g,exec
      - /run
    volumes:
      - /var/lib/sync-raindrop:/var/lib/sync-raindrop
      - /opt/sync-raindrop/.env:/secrets/.env:ro
      - /opt/sync-raindrop/rclone:/secrets/rclone
      - /opt/files/public/sync-raindrop:/public/sync-raindrop
    environment:
      - TZ=America/Sao_Paulo
      # yt-dlp sai pela fibra residencial (proxy do host no túnel WireGuard) → sem bot-wall do YouTube.
      # É o PRIMÁRIO; se o proxy/túnel cair, o yt-dlp falha e o Apify assume (failover em software).
      - YTDLP_PROXY=http://172.28.0.1:8890
    mem_limit: 1536m
    pids_limit: 256
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,sys;d=json.load(open('/var/lib/sync-raindrop/health.json'));sys.exit(0 if d['ok'] else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# sub-rede FIXA: host/docker-user-egress.sh bloqueia RFC1918/link-local a partir dela (DOCKER-USER)
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
